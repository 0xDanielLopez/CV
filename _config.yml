            Part of Okta's <mark>Identity Threat Research</mark> team, researching identity-focused threats and attacker tactics, techniques and procedures.

      - layout: left
        title: Cloud Software Group
        link: cloud.com
        # link_text: boringcompany.com
        sub_title: Sr. Security Engineer
        caption: Oct. 2020 - Jun. 2024
        #quote: >
        #  Solving 21st century problems by diging holes and making game changing products like the *not a flamethrower*
        description: | # this will include new lines to allow paragraphs
            Worked in Cloud Software Group's global Security Operations Center, protecting the organization and strengthening its security posture through a 24/7 service.

            Key Responsibilities:

            - <mark>Analyzed, contained and remediated</mark> malware, email campaigns, fraud and abuse, insider threats and data-loss incidents
            - <mark>Hunted threats</mark> and researched malware and phishing campaigns, translating findings into concrete mitigations
            - Partnered with SIEM and Detection Engineering to tune alerts, reduce noise and improve detection performance

            Technologies used in this role:

            <mark>AWS / Azure (Cloud)</mark> • <mark>Microsoft Defender for Endpoint / Falcon CrowdStrike (EDR)</mark> • <mark>Splunk (SIEM)</mark> • <mark>Cortex XSOAR (SOAR)</mark> 

      - layout: left
        title: Banco Santander
        link: bancosantander.es
        # link_text: boringcompany.com
        sub_title: Global SOC Security Analyst
        caption: Aug. 2018 - Oct. 2020
        #quote: >
        #  Solving 21st century problems by diging holes and making game changing products like the *not a flamethrower*
        description: | # this will include new lines to allow paragraphs
            Worked in Banco Santander's Global SOC, providing 24/7 monitoring and an on-call service to the bank's entities worldwide.

            Key Responsibilities:

            - Performed <mark>in-depth investigation and mitigation</mark> of security incidents
            - Monitored web traffic and <mark>critical SWIFT assets</mark>, investigating malware, phishing, DDoS and brute-force activity
            - Supported <mark>fraud prevention</mark> across phishing, suspicious email, compromised cards, mule accounts, data leaks and impersonation

            Technologies used in this role:

            <mark>AWS (Cloud)</mark> • <mark>Falcon CrowdStrike (EDR)</mark> • <mark>Splunk (SIEM)</mark> • <mark>IBM QRadar (SOAR)</mark> • <mark>Cisco Ironport (Proxy)</mark> • <mark>McAfee (IPS)</mark>
      - layout: left
        title: Deloitte
        link: deloitte.com
        # link_text: boringcompany.com
        sub_title: CyberSOC Security Analyst
        caption: Aug. 2017 - Aug. 2018
        #quote: >
        #  Solving 21st century problems by diging holes and making game changing products like the *not a flamethrower*
        description: | # this will include new lines to allow paragraphs
            Security Analyst in Deloitte's CyberSOC, delivering managed security services for national and international clients.

            Key Responsibilities:

            - Conducted <mark>initial triage</mark> of SIEM alerts to identify potential threats
            - Applied playbooks and immediate containment or remediation measures when required
            - Escalated potential incidents with the context and evidence needed for further investigation

            Technologies used in this role:

            <mark>Splunk (SIEM)</mark> • <mark>QRadar (SIEM)</mark> • <mark>ArcSight (SIEM)</mark> • <mark>FireEye (IPS)</mark> • <mark>McAfee (ePO)</mark>

