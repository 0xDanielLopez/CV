        quote: >
          Suspicious phishing sites, captured and enriched
        description: | # this will include new lines to allow paragraphs
          phishunt identifies and monitors <mark>suspicious phishing sites</mark>. It captures suspicious sites, enriches them with hosting, certificate and network context, and publishes the results as an open feed.

          Built with <mark>Django</mark>, <mark>JavaScript</mark>, <mark>Python</mark> and <mark>Bash</mark>.
      
