# About Section
about_profile_image: images/profile.jpg
about_content: | # this will include new lines to allow paragraphs
  I am a <mark>Cyber Threat Researcher</mark> with a background spanning identity threat research, phishing investigations, incident response, threat hunting and security operations. Since 2017, I have helped international organizations in a wide range of sectors investigate, contain and remediate threats across diverse environments.

  I also build <mark>open security tools</mark>. I enjoy turning noisy data into practical intelligence with <mark>AI</mark>, cloud services and APIs.

content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: top-middle
        title: TweetFeed
        link: tweetfeed.live
        quote: >
          An open feed of indicators shared by the security community
        description: | # this will include new lines to allow paragraphs
          TweetFeed collects and organizes <mark>indicators of compromise</mark> posted on X. It focuses on URLs, domains, IP addresses and file hashes, and publishes them as an open feed.

      - layout: top-middle
        title: phishunt
        link: phishunt.io
        quote: >
          Suspicious phishing sites, captured and enriched
        description: | # this will include new lines to allow paragraphs
          phishunt identifies and monitors <mark>suspicious phishing sites</mark>. It captures them, enriches them with hosting, certificate and network context, and publishes the results as an open feed.
      
  - title: Experience # Title for the section
    layout: list # Type of content section (list/text)
    content:

      - layout: left
        title: Okta
        link: okta.com
        sub_title: Cyber Threat Researcher
        caption: Jun. 2024 - Present
        description: | # this will include new lines to allow paragraphs
            Part of Okta's <mark>Identity Threat Research</mark> team, researching identity-focused threats and attacker tactics, techniques and procedures.

            A few pieces of research published on the Okta Threat Intelligence blog:

            - Aug. 23, 2026 - [First on the scene of the (cyber)crime](https://www.okta.com/blog/threat-intelligence/first-on-the-scene-of-the-cybercrime/){:target="_blank" rel="noopener"}
            - May 2, 2026 - [Tycoon 2FA phishing actors disperse, branch into new attacks](https://www.okta.com/blog/threat-intelligence/tycoon_2fa_phishing_actors_scatter/){:target="_blank" rel="noopener"}
            - Dec. 19, 2025 - [Jobseekers exploited in fake recruiter phishing campaigns](https://www.okta.com/blog/threat-intelligence/jobseekers-exploited-in-fake-recruiter-phishing-campaigns/){:target="_blank" rel="noopener"}
            - Sep. 30, 2025 - [EvilProxy phishing campaign leverages convincing impersonations of enterprise applications](https://www.okta.com/blog/threat-intelligence/evil-proxy-phishing-campaign/){:target="_blank" rel="noopener"}
            - Aug. 28, 2025 - [Attackers target hotelier accounts in malvertising and phishing campaign](https://www.okta.com/blog/threat-intelligence/attackers-target-hotelier-accounts-in-malvertising-and-phishing-/){:target="_blank" rel="noopener"}
            - Jun. 19, 2025 - [How this ClickFix campaign leads to Redline Stealer](https://www.okta.com/blog/threat-intelligence/how-this-click-fix-campaign-leads-to-redline-stealer/){:target="_blank" rel="noopener"}

      - layout: left
        title: Cloud Software Group
        link: cloud.com
        sub_title: Sr. Security Engineer
        caption: Oct. 2020 - Jun. 2024
        description: | # this will include new lines to allow paragraphs
            Worked in Cloud Software Group's global Security Operations Center, handling 24/7 incident response, threat hunting and detection tuning.

            Key Responsibilities:

            - <mark>Analyzed, contained and remediated</mark> malware, malicious email campaigns, fraud and abuse, insider threats and data-loss incidents
            - <mark>Hunted threats</mark> and researched malware and phishing campaigns, translating findings into concrete mitigations
            - Partnered with SIEM and Detection Engineering to tune alerts, reduce noise and improve detection performance

      - layout: left
        title: Banco Santander
        link: bancosantander.es
        sub_title: Global SOC Security Analyst
        caption: Aug. 2018 - Oct. 2020
        description: | # this will include new lines to allow paragraphs
            Worked in Banco Santander's Global SOC, providing 24/7 monitoring and an on-call service to the bank's entities worldwide.

            Key Responsibilities:

            - Performed <mark>in-depth investigation and mitigation</mark> of security incidents
            - Monitored web traffic and <mark>critical SWIFT assets</mark>, investigating malware, phishing, DDoS and brute-force activity
            - Supported <mark>fraud prevention</mark> across phishing, suspicious email, compromised cards, mule accounts, data leaks and impersonation
      - layout: left
        title: Deloitte
        link: deloitte.com
        sub_title: CyberSOC Security Analyst
        caption: Aug. 2017 - Aug. 2018
        description: | # this will include new lines to allow paragraphs
            Worked in Deloitte's CyberSOC, delivering managed security services for national and international clients.

            Key Responsibilities:

            - Conducted <mark>initial triage</mark> of SIEM alerts to identify potential threats
            - Applied playbooks and immediate containment or remediation measures when required
            - Escalated potential incidents with the context and evidence needed for further investigation

