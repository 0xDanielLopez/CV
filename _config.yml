          # - title:  Github page for project (eg. sproogen/modern-resume-theme)
          #   icon: fab fa-github
          #   url: Link to project (eg. sproogen.github.io/modern-resume-theme)
        quote: >
          An open feed of indicators shared by the security community
        description: | # this will include new lines to allow paragraphs
          TweetFeed collects and organizes <mark>indicators of compromise shared by the security community</mark> on X. It focuses on URLs, domains, IP addresses and file hashes, making continuously shared intelligence easier to consume.

          Built with <mark>JavaScript</mark>, <mark>Python</mark> and <mark>Bash</mark>.

      - layout: top-middle
        title: phishunt
        link: phishunt.io
        # link_text: Project Website
        #additional_links:
